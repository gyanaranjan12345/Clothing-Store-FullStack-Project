<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-body p-4">

          <h2 class="text-center mb-4">
            Login
          </h2>

          <form
            (ngSubmit)="login()"
          >

            <div class="mb-3">

              <label>Email</label>

              <input
                type="email"
                class="form-control"
                [(ngModel)]="email"
                name="email"
                required
              >

            </div>

            <div class="mb-3">

              <label>Password</label>

              <input
                type="password"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                required
              >

            </div>

            <button
              class="btn btn-dark w-100"
              type="submit"
            >
              Login
            </button>

          </form>

          <div
            class="text-center mt-3"
          >
            Don't have an account?

            <a routerLink="/register">
              Register
            </a>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<div class="container py-5">

  <h2 class="mb-4">
    Checkout
  </h2>

  <div class="row">

    <div class="col-lg-8">

      <div class="card">

        <div class="card-body">

          <h4 class="mb-4">
            Delivery Address
          </h4>

          <form
            (ngSubmit)="placeOrder()"
          >

            <div class="mb-3">

              <label>
                Full Name
              </label>

              <input
                type="text"
                class="form-control"
                [(ngModel)]="order.fullName"
                name="fullName"
                required
              >

            </div>

            <div class="mb-3">

              <label>
                Phone Number
              </label>

              <input
                type="tel"
                class="form-control"
                [(ngModel)]="
                  order.phoneNumber
                "
                name="phoneNumber"
                required
              >

            </div>

            <div class="mb-3">

              <label>
                Address Line 1
              </label>

              <input
                class="form-control"
                [(ngModel)]="
                  order.addressLine1
                "
                name="addressLine1"
                required
              >

            </div>

            <div class="mb-3">

              <label>
                Address Line 2
              </label>

              <input
                class="form-control"
                [(ngModel)]="
                  order.addressLine2
                "
                name="addressLine2"
              >

            </div>

            <div class="row">

              <div class="col-md-4">

                <label>
                  City
                </label>

                <input
                  class="form-control"
                  [(ngModel)]="order.city"
                  name="city"
                  required
                >

              </div>

              <div class="col-md-4">

                <label>
                  State
                </label>

                <input
                  class="form-control"
                  [(ngModel)]="order.state"
                  name="state"
                  required
                >

              </div>

              <div class="col-md-4">

                <label>
                  Pincode
                </label>

                <input
                  class="form-control"
                  [(ngModel)]="
                    order.pincode
                  "
                  name="pincode"
                  required
                >

              </div>

            </div>


            <h4 class="mt-5 mb-3">
              Payment Method
            </h4>

            <div class="form-check">

              <input
                class="form-check-input"
                type="radio"
                name="payment"
                value="COD"
                [(ngModel)]="
                  order.paymentMethod
                "
              >

              <label class="form-check-label">

                Cash on Delivery

              </label>

            </div>

            <div class="form-check mt-2">

              <input
                class="form-check-input"
                type="radio"
                name="payment"
                value="ONLINE"
                [(ngModel)]="
                  order.paymentMethod
                "
              >

              <label class="form-check-label">

                Online Payment

              </label>

            </div>


            <button
              type="submit"
              class="btn btn-dark
                     btn-lg mt-5"
              [disabled]="submitting"
            >

              {{
                submitting
                  ? 'Placing Order...'
                  : 'Place Order'
              }}

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>

<div class="container-fluid mt-4">

  <h2 class="mb-4">
    Admin Dashboard
  </h2>

  <div class="row">

    <!-- Products -->

    <div class="col-md-3 mb-4">

      <div class="card shadow-sm">

        <div class="card-body">

          <div
            class="d-flex justify-content-between"
          >

            <div>

              <h6>
                Total Products
              </h6>

              <h2>
                {{ totalProducts }}
              </h2>

            </div>

            <i
              class="bi bi-box-seam fs-1"
            ></i>

          </div>

        </div>

      </div>

    </div>

    <!-- Orders -->

    <div class="col-md-3 mb-4">

      <div class="card shadow-sm">

        <div class="card-body">

          <div
            class="d-flex justify-content-between"
          >

            <div>

              <h6>
                Total Orders
              </h6>

              <h2>
                {{ totalOrders }}
              </h2>

            </div>

            <i
              class="bi bi-cart-check fs-1"
            ></i>

          </div>

        </div>

      </div>

    </div>

    <!-- Customers -->

    <div class="col-md-3 mb-4">

      <div class="card shadow-sm">

        <div class="card-body">

          <div
            class="d-flex justify-content-between"
          >

            <div>

              <h6>
                Customers
              </h6>

              <h2>
                {{ totalCustomers }}
              </h2>

            </div>

            <i
              class="bi bi-people fs-1"
            ></i>

          </div>

        </div>

      </div>

    </div>

    <!-- Revenue -->

    <div class="col-md-3 mb-4">

      <div class="card shadow-sm">

        <div class="card-body">

          <div
            class="d-flex justify-content-between"
          >

            <div>

              <h6>
                Revenue
              </h6>

              <h2>
                ₹{{ totalRevenue }}
              </h2>

            </div>

            <i
              class="bi bi-currency-rupee fs-1"
            ></i>

          </div>

        </div>

      </div>

    </div>

  </div>

  <div class="row mt-3">

    <div class="col-md-4">

      <a
        routerLink="/admin/products"
        class="btn btn-dark w-100 p-3"
      >
        <i class="bi bi-box"></i>
        Manage Products
      </a>

    </div>

    <div class="col-md-4">

      <a
        routerLink="/admin/categories"
        class="btn btn-dark w-100 p-3"
      >
        <i class="bi bi-tags"></i>
        Manage Categories
      </a>

    </div>

    <div class="col-md-4">

      <a
        routerLink="/admin/orders"
        class="btn btn-dark w-100 p-3"
      >
        <i class="bi bi-receipt"></i>
        Manage Orders
      </a>

    </div>

  </div>

</div>

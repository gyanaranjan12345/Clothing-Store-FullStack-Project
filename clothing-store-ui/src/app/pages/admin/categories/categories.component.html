<div class="container mt-4">

  <h2 class="mb-4">
    Manage Categories
  </h2>

  <div class="card mb-4">

    <div class="card-body">

      <h5>
        Add Category
      </h5>

      <form
        (ngSubmit)="addCategory()"
      >

        <div class="row">

          <div class="col-md-5">

            <input
              class="form-control"
              placeholder="Category name"
              [(ngModel)]="
                newCategory.name
              "
              name="name"
              required
            >

          </div>

          <div class="col-md-5">

            <input
              class="form-control"
              placeholder="Description"
              [(ngModel)]="
                newCategory.description
              "
              name="description"
            >

          </div>

          <div class="col-md-2">

            <button
              class="btn btn-dark w-100"
              type="submit"
            >
              Add
            </button>

          </div>

        </div>

      </form>

    </div>

  </div>

  <div class="card">

    <div class="card-body">

      <table
        class="table table-hover"
      >

        <thead>

          <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Description</th>

            <th>Action</th>

          </tr>

        </thead>

        <tbody>

          <tr
            *ngFor="
              let category of categories
            "
          >

            <td>
              {{ category.id }}
            </td>

            <td>
              {{ category.name }}
            </td>

            <td>
              {{ category.description }}
            </td>

            <td>

              <button
                class="btn btn-danger btn-sm"
                (click)="
                  deleteCategory(
                    category.id
                  )
                "
              >
                Delete
              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

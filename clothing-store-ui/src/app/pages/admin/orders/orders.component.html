<div class="container-fluid mt-4">

  <h2 class="mb-4">
    Manage Orders
  </h2>

  <div
    class="card mb-3"
    *ngFor="let order of orders"
  >

    <div class="card-header">

      <div
        class="d-flex justify-content-between"
      >

        <strong>
          Order #{{ order.orderId }}
        </strong>

        <span class="badge bg-dark">
          {{ order.orderStatus }}
        </span>

      </div>

    </div>

    <div class="card-body">

      <p>
        <strong>Customer:</strong>
        {{ order.customerEmail }}
      </p>

      <p>
        <strong>Phone:</strong>
        {{ order.phoneNumber }}
      </p>

      <p>
        <strong>Address:</strong>
        {{ order.shippingAddress }}
      </p>

      <hr>

      <div
        *ngFor="let item of order.items"
      >

        {{ item.productName }}

        × {{ item.quantity }}

        = ₹{{ item.subtotal }}

      </div>

      <hr>

      <h5>
        Total: ₹{{ order.totalAmount }}
      </h5>

      <div class="mt-3">

        <button
          class="btn btn-outline-primary me-2"
          *ngIf="
            order.orderStatus === 'PLACED'
          "
          (click)="
            updateStatus(
              order.orderId,
              'CONFIRMED'
            )
          "
        >
          Confirm
        </button>

        <button
          class="btn btn-outline-warning me-2"
          *ngIf="
            order.orderStatus === 'CONFIRMED'
          "
          (click)="
            updateStatus(
              order.orderId,
              'SHIPPED'
            )
          "
        >
          Ship
        </button>

        <button
          class="btn btn-outline-success"
          *ngIf="
            order.orderStatus === 'SHIPPED'
          "
          (click)="
            updateStatus(
              order.orderId,
              'DELIVERED'
            )
          "
        >
          Deliver
        </button>

      </div>

    </div>

  </div>

</div>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">My Wishlist</h2>
    <a routerLink="/products" class="btn btn-outline-dark">Continue Shopping</a>
  </div>

  <div *ngIf="items.length; else emptyWishlist" class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let item of items">
      <div class="card h-100 shadow-sm border-0">
        <img
          [src]="item.imageUrl || item.product?.imageUrl || item.productImage || 'https://via.placeholder.com/400x300?text=No+Image'"
          class="card-img-top"
          [alt]="item.name || item.product?.name || 'Wishlist item'"
          style="height: 220px; object-fit: cover;"
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title mb-1">{{ item.name || item.product?.name || 'Product' }}</h5>
          <p class="text-muted mb-2">{{ item.color || item.product?.color || '' }}</p>
          <p class="fw-bold mb-3">₹{{ item.price || item.product?.price || 0 }}</p>

          <div class="mt-auto d-flex gap-2">
            <a [routerLink]="['/products', item.productId || item.id || item.product?.id]" class="btn btn-dark flex-fill">View Details</a>
            <button class="btn btn-outline-danger" (click)="removeFromWishlist(item)">Remove</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #emptyWishlist>
    <div class="text-center py-5 border rounded bg-light">
      <h4 class="mb-3">Your wishlist is empty</h4>
      <a routerLink="/products" class="btn btn-dark">Explore Products</a>
    </div>
  </ng-template>
</div>
